[package]
name = "teleflock"
description = "TeleFlock: a native GUI for omp agents running in herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# `_lib` suffix avoids a name clash between the lib and the bin on Windows (cargo#8519).
name = "teleflock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "3"

[dependencies]
tf-client = { path = "../crates/tf-client" }
tf-proto = { path = "../crates/tf-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-deep-link = "2.6.2"
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util"] }
percent-encoding = "2"
# Self-update (src/update): GitHub release discovery + APK download. rustls on ring with the
# webpki roots (no platform verifier: it needs JNI setup on Android); ring is already built for russh.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
semver = "1"
sha2 = "0.10"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
# Windows 11 Snap Layouts over the custom maximize button (no-op on other desktops).
tauri-plugin-snap-layout = "1.0.9"
# Windows self-update: download, minisign verification and the passive NSIS install.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Quick capture's system-wide shortcut (src/capture.rs; X11 on Linux, none on Wayland).
tauri-plugin-global-shortcut = "2.4.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# Same major as tauri/wry (no second copy of the windows crate).
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications and idle time over the session bus (xdg_notify.rs, idle.rs). Already in the
# build through tauri-plugin-single-instance (same default features), so no new crate.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# UNUserNotificationCenter (mac_notify.rs). Same versions tauri/wry use on macOS; only the
# bindings crate is new to the build.
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-teleflock-android = { path = "plugins/teleflock-android" }
