"$schema" = "schemas/schema.json"

[default]
description = "Webview access to haptics, the notification permission flow, battery-optimisation status, dictation (microphone permission flow, system speech recognizer), the share sheet for images and items shared to TeleFlock."
permissions = [
  "allow-haptic",
  "allow-notification-permission",
  "allow-request-notification-permission",
  "allow-battery-status",
  "allow-request-ignore-battery-optimizations",
  "allow-request-microphone-permission",
  "allow-open-app-settings",
  "allow-dictation-available",
  "allow-start-dictation",
  "allow-stop-dictation",
  "allow-cancel-dictation",
  "allow-share-image",
  "allow-take-shares",
]
