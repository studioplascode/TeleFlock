# tf-hostd for every host the app deploys to (static musl x86_64/aarch64 via zig, Windows via
# cargo-xwin, side by side: scripts/build-hostd.sh). Called by android.yml, linux.yml, windows.yml
# and macos.yml: the app embeds these binaries at build time (tf-client build.rs reads
# $TF_HOSTD_DIST/<triple>/tf-hostd[.exe] and the .zst build-hostd.sh writes next to it).
name: hostd

on:
  workflow_call:
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          key: hostd
          # build-hostd.sh's build dirs (cargo-zigbuild, cargo-xwin)
          workspaces: |
            . -> target/hostd-build
            . -> target/hostd-build-xwin

      - name: Cross tools (clang/lld for cargo-xwin, zstd for the embedded copies)
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm file zstd

      - name: Build tf-hostd (all triples)
        # Installs zig, cargo-zigbuild and cargo-xwin on demand.
        run: sudo mkdir -p /opt/zig && sudo chown "$USER" /opt/zig && scripts/build-hostd.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tf-hostd-dist
          path: target/hostd-dist/
          if-no-files-found: error
