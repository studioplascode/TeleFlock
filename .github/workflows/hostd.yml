# tf-hostd for every host the app deploys to (static musl x86_64/aarch64 via zig, Windows via
# cargo-xwin). Called by windows.yml and android.yml: the app embeds these binaries at build time
# (tf-client build.rs reads $TF_HOSTD_DIST/<triple>/tf-hostd[.exe]).
name: hostd

on:
  workflow_call:
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          key: hostd
          workspaces: '. -> target/hostd-build'

      - name: Cross tools (clang/lld for cargo-xwin)
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm file

      - name: Build tf-hostd (all triples)
        # Installs zig, cargo-zigbuild and cargo-xwin on demand.
        run: sudo mkdir -p /opt/zig && sudo chown "$USER" /opt/zig && scripts/build-hostd.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tf-hostd-dist
          path: target/hostd-dist/
          if-no-files-found: error
