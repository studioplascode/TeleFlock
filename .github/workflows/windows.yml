# TeleFlock Windows installer (NSIS setup .exe) on a native Windows runner.
# Layout: Cargo workspace root = repo root (target/ at repo root), Tauri app in src-tauri/, bun.
# Local cross-build alternative: scripts/build-windows.sh (docs/build.md §5).
name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hostd:
    uses: ./.github/workflows/hostd.yml

  nsis:
    needs: hostd
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TF_HOSTD_DIST: ${{ github.workspace }}/target/hostd-dist
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: tf-hostd-dist
          path: target/hostd-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build NSIS installer
        # beforeBuildCommand (bun run build) builds the frontend.
        run: bun tauri build --target x86_64-pc-windows-msvc --bundles nsis
        # Authenticode signing: set bundle.windows.signCommand / certificateThumbprint and pass
        # the certificate via secrets here (not configured yet).

      - uses: actions/upload-artifact@v4
        with:
          name: teleflock-windows-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
