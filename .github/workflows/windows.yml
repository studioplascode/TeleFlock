# TeleFlock Windows installer (NSIS setup .exe) on a native Windows runner.
# Layout: Cargo workspace root = repo root (target/ at repo root), Tauri app in src-tauri/, bun.
# Local cross-build alternative: scripts/build-windows.sh (docs/build.md §5).
# CI never sees the updater signing key: the installer is built without updater artifacts
# (no .sig), so it can't be published as an update. Releases are built and signed locally with
# scripts/release.sh (docs/build.md §11).
name: windows

on:
  workflow_dispatch:
  # Releases are built on the release box (scripts/release.sh), so pushes and tags build nothing
  # here. Pull requests build when they change what the installer is built from.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.research/**'
      - '!drafts/**'
      - '!site/**'
      - '!LICENSE'
      - '!packaging/**'
      - '!scripts/**'
      - 'scripts/build-hostd.sh'
      - '!.github/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/hostd.yml'
      - '!src-tauri/gen/android/**'
      - '!src-tauri/plugins/teleflock-android/**'
      - '!src-tauri/linux/**'
      - '!src-tauri/tauri.linux.conf.json'
      - '!src-tauri/tauri.macos.conf.json'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hostd:
    uses: ./.github/workflows/hostd.yml

  nsis:
    needs: hostd
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TF_HOSTD_DIST: ${{ github.workspace }}/target/hostd-dist
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: tf-hostd-dist
          path: target/hostd-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Cache the speech engine's archives (crates/tf-dictation/build.rs)
        # The sha256-pinned sherpa-onnx archive and VAD model, not what they unpack to (1 GB here):
        # build.rs checks an archive's sha256 before it extracts it, but trusts an extracted
        # directory. Keyed by build.rs, where the sherpa-onnx version and every sha256 are pinned.
        # After rust-cache: post steps run in reverse, so this saves before rust-cache's cleanup
        # deletes the files in target/ that cargo didn't make.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            target/native-cache/*.tar.bz2
            target/native-cache/*-silero_vad.onnx
          key: sherpa-onnx-x86_64-pc-windows-msvc-${{ hashFiles('crates/tf-dictation/build.rs') }}

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build NSIS installer (no updater .sig)
        # beforeBuildCommand (bun run build) builds the frontend.
        shell: bash
        run: bun tauri build --target x86_64-pc-windows-msvc --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        # Authenticode signing: set bundle.windows.signCommand / certificateThumbprint and pass
        # the certificate via secrets here (not configured yet).

      - uses: actions/upload-artifact@v4
        with:
          name: teleflock-windows-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
