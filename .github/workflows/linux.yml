# TeleFlock Linux packages (.deb + AppImage, x86_64) on ubuntu-22.04: the oldest supported
# Ubuntu LTS with webkit2gtk-4.1 and the same environment as the release container
# (packaging/linux/Dockerfile), so the glibc floor stays at Debian 12 / Ubuntu 22.04.
# Layout: Cargo workspace root = repo root (target/ at repo root), Tauri app in src-tauri/, bun.
# CI never holds the updater key: packages are built without updater .sig files and are not
# release assets. Releases (signed .deb/AppImage + Arch package) come from scripts/build-linux.sh
# via scripts/release.sh on the release box (docs/build.md §11, §12); this workflow keeps the
# Linux build green and produces test artifacts. Third-party actions are pinned by commit SHA.
name: linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hostd:
    uses: ./.github/workflows/hostd.yml

  bundle:
    needs: hostd
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TF_HOSTD_DIST: ${{ github.workspace }}/target/hostd-dist
      # linuxdeploy's bundled strip predates the .relr.dyn sections of current toolchains.
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tf-hostd-dist
          path: target/hostd-dist

      - name: Tauri Linux deps
        # Same list as packaging/linux/Dockerfile.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential \
            pkg-config curl wget file patchelf xdg-utils

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '. -> target'

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build .deb + AppImage
        # beforeBuildCommand (bun run build) builds the frontend; no updater artifacts (no key here).
        run: bun tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Inspect packages
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          dpkg-deb --contents target/release/bundle/deb/*.deb
          dpkg-deb --fsys-tarfile target/release/bundle/deb/*.deb | tar -xO usr/share/applications/TeleFlock.desktop
          objdump -T target/release/teleflock | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1
          ls -la target/release/bundle/appimage/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teleflock-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
