# RenameCtx lab (setup.sh copies this into the lab's omp agent dir): one keyless OpenAI chat-completions
# provider served by mock.ts (next to this file) on 127.0.0.1:18741. The agent (default role) and omp's
# tiny role (TeleFlock's ai.complete) both use it.
providers:
  mock:
    baseUrl: http://127.0.0.1:18741/v1
    api: openai-completions
    auth: none
    models:
      - id: lab-1
        name: RenameCtx Lab Mock
        reasoning: false
        input: [text]
        contextWindow: 1000000
        maxTokens: 32768
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
