# Agent chat lab omp settings (isolated agent dir; setup.sh copies this in): every role on the mock
# (subagents run on `task`), no tool approvals, no setup wizard, no update checks. Subagents start
# when the model's `task` call is complete (no speculative launch) and finish when they say so (no
# completion probe), so the mock's script decides every step; omp's default recursion depth (2)
# lets the Orchestrator spawn its workers.
modelRoles:
  default: mock/lab-1
  smol: mock/lab-1
  slow: mock/lab-1
  vision: mock/lab-1
  plan: mock/lab-1
  commit: mock/lab-1
  tiny: mock/lab-1
  memory: mock/lab-1
  task: mock/lab-1
  advisor: mock/lab-1
  widget: mock/lab-1
  judge: mock/lab-1
disabledProviders: [ollama, lm-studio, llama.cpp, apple, web]
tools:
  approvalMode: yolo
task:
  speculativeLaunch: false
  completionProbe: false
setupVersion: 2
startup:
  setupWizard: false
  checkUpdate: false
  changelogMode: hidden
