# ChatStall lab (setup.sh copies this into the lab's omp agent dir): one keyless Anthropic Messages
# provider served by mock.ts (next to this file) on 127.0.0.1:18761.
providers:
  chatstall:
    baseUrl: http://127.0.0.1:18761
    api: anthropic-messages
    auth: none
    models:
      - id: lab-1
        name: ChatStall Lab Mock
        reasoning: false
        input: [text]
        contextWindow: 200000
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
