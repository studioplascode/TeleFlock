[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
authors = ["TeleFlock"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2.12.4" }
tauri-build = { version = "2.7.3" }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
