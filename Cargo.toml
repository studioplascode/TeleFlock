[workspace]
resolver = "3"
# Explicit list (a `crates/*` glob breaks every build while a crate dir exists without a manifest).
# Owners: add your crate here yourself once its Cargo.toml and src/lib.rs|main.rs exist.
members = [
    "crates/tf-client",
    "crates/tf-collab",
    "crates/tf-devserver",
    "crates/tf-herdr",
    "crates/tf-hostd",
    "crates/tf-proto",
    "crates/tf-transport",
    "src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Studio Plascode"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2.12.4" }
tauri-build = { version = "2.7.3" }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
