[package]
name = "tf-hostd"
description = "TeleFlock host daemon: collab relay + guests, herdr state, agent ops, client protocol"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tf-hostd"
path = "src/main.rs"

[dependencies]
tf-proto = { path = "../tf-proto" }
tf-herdr = { path = "../tf-herdr" }
tf-collab = { path = "../tf-collab" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# HostdOps (ops/{fs,git,gh,host,term,workspace,worktree}.rs)
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
