[package]
name = "tf-client"
description = "TeleFlock app core: host profiles, connections, hostd deploy, protocol client, app methods, tunnels, notification policy"
version.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
tf-proto = { path = "../tf-proto" }
tf-transport = { path = "../tf-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process"] }
sha2 = "0.10"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ruzstd = "0.8"

[build-dependencies]
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
