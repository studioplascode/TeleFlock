[package]
name = "tf-client"
description = "TeleFlock app core: host profiles, connections, hostd deploy, protocol client, app methods, tunnels, notification policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
# Session recordings record the microphone and transcribe it (tf-dictation, recording/voice.rs).
# Without it a recording's voice and transcript are `unavailable`. The desktop app and lab
# devservers turn it on.
voice = ["dep:tf-dictation"]

[dependencies]
tf-proto = { path = "../tf-proto" }
tf-transport = { path = "../tf-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process"] }
sha2 = "0.10"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# zstd: the embedded tf-hostd binaries, the session cache, and (async-compression) the zstd
# streams to tf-hostd.
zstd = "0.14"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
# The TeleFlock Browser (browser/): DevTools WebSockets to the browser and from agents (its
# proxy), the base64 frames of agents' connections, their HTTP requests.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
httparse = "1"
tf-dictation = { path = "../tf-dictation", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The TeleFlock Browser on desktops: the Chrome for Testing download (rustls on ring with the
# webpki roots, as the app's updater and tf-dictation), the zip it comes in, the downloads folder.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "7"

[target.'cfg(unix)'.dependencies]
# The browser process: SIGTERM, its process group, and the parent-death signal (Linux).
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
# Paused clock (`start_paused`) for the link's ping-rule test.
tokio = { version = "1", features = ["test-util"] }
# tests/host_key.rs reuses tf-transport's in-process SSH server (tests/support).
bytes = "1"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "rsa", "ring"] }
# Session sync end to end against tf-hostd's real subscription and stream code (sessions.rs tests).
tf-hostd = { path = "../tf-hostd" }
